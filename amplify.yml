version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Use 'npm ci' for a clean, fast, reliable install
        - npm ci
    build:
      commands:
        - env | grep -e NEXT_PUBLIC_ >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .
    files:
      - '.next/standalone/**/*'
      - '.next/static/**/*'
      - 'public/**/*'
  cache:
    paths:
      - .next/cache/**/*
      - node_modules/**/*