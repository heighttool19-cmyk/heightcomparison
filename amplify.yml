version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
  build:
    commands:
      - env | grep -e NEXT_PUBLIC_ >> .env.production
      - npm run build
      - cp .next/required-server-files.json .next/standalone/
      - cp -r .next/static .next/standalone/.next/static
      - cp -r public .next/standalone/public
  artifacts:
    baseDirectory: .next/standalone
    files:
      - '**/*'
    secondaryArtifacts:
      - baseDirectory: .next/static
        files:
          - '**/*'
        name: static
      - baseDirectory: public
        files:
          - '**/*'
        name: public
  cache:
    paths:
      - .next/cache/**/*
      - node_modules/**/*