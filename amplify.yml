version: 1
frontend:
  phases:
    preBuild:
      commands:
        # 1. This force-cleans the environment regardless of the cache
        - rm -rf node_modules .next/cache
        # 2. This tells AWS to use NPM (no corepack/pnpm)
        - npm install
    build:
      commands:
        - env | grep -e NEXT_PUBLIC_ >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .
    files:
      - '.next/standalone/**/*'
      - '.next/static/**/*'
      - 'public/**/*'
  cache:
    paths:
      - .next/cache/**/*
      - node_modules/**/*